<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f5f7fb;--ink:#101828;--muted:#667085;--line:#e4e7ec;--card:#fff;--soft:#f8fafc;--accent:#5b5cf0;--accentSoft:#efefff;--green:#147a55;--greenSoft:#eaf7f0;--amber:#9a5a08;--amberSoft:#fff4e5;--red:#b42318;--navy:#101828}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}.brand strong{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.badge{font-size:9px;letter-spacing:.08em;font-weight:850;color:var(--amber);background:var(--amberSoft);padding:6px 8px;border-radius:999px}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 64px)}.nav{background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.nav-head{padding:8px 10px 12px}.nav-head span{font-size:9px;letter-spacing:.12em;color:#98a2b3;font-weight:850}.nav-head strong{display:block;margin-top:4px;font-size:16px}.model-btn{width:100%;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:9px;color:#475467;margin-bottom:3px}.model-btn.active{background:var(--accentSoft);border-color:#d9d7ff;color:#3730a3}.idx{width:28px;height:28px;border-radius:8px;background:#f2f4f7;display:grid;place-items:center;font-size:10px;font-weight:850}.model-btn.active .idx{background:var(--accent);color:#fff}.model-btn b{font-size:12px;line-height:1.15}.main{padding:22px;max-width:1500px;width:100%;margin:0 auto}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}.eyebrow{font-size:9px;color:#98a2b3;letter-spacing:.12em;font-weight:850}.intro h1{margin:5px 0 6px;font-size:clamp(28px,3vw,40px);letter-spacing:-.04em;line-height:1}.intro p{margin:0;color:var(--muted);font-size:13px;max-width:740px}.fit{min-width:150px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px}.fit span{font-size:8px;color:#98a2b3;letter-spacing:.09em;font-weight:850}.fit strong{display:block;margin-top:4px;font-size:15px}.stage{min-height:610px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(16,24,40,.07)}.eval{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.eval>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.eval span{display:block;font-size:8px;color:#98a2b3;font-weight:850;letter-spacing:.08em}.eval strong{display:block;margin-top:3px;font-size:12px}.score{display:inline-grid;place-items:center;min-width:46px;height:28px;padding:0 8px;border-radius:999px;background:var(--greenSoft);color:var(--green);font-size:11px;font-weight:850}.rank{width:30px;height:30px;border-radius:8px;background:#111827;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:850}.reason{padding:13px 14px;border-radius:12px;background:var(--accentSoft);border:1px solid #dddafe;font-size:12px;line-height:1.45;color:#344054}.metric-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:9px}.metric{border:1px solid var(--line);border-radius:11px;padding:10px}.metric span{display:block;color:#98a2b3;font-size:8px;font-weight:800;letter-spacing:.05em}.metric strong{display:block;margin-top:4px;font-size:17px}.call{width:100%;min-height:54px;border:0;border-radius:13px;background:#101828;color:#fff;font-weight:850;margin:13px 0 8px}.outcomes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.outcomes button{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;color:#475467;font-size:10px;font-weight:760}.outcomes button.book{background:var(--greenSoft);color:var(--green);border-color:#cdebdc}.hero-row{display:flex;align-items:center;gap:9px}.hero-row h2{margin:0;font-size:34px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:12px;margin:7px 0 15px}.queue{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:610px}.qleft{padding:12px;background:#fbfcfe;border-right:1px solid var(--line)}.qleft h3{font-size:13px;margin:4px 5px 9px}.qitem{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:7px;align-items:center;border:0;background:transparent;border-radius:10px;padding:9px 7px;text-align:left}.qitem.active{background:var(--accentSoft)}.qitem strong{font-size:11px}.qitem small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.focus{padding:30px;display:grid;align-content:center}.focus-inner{max-width:750px;margin:auto;width:100%}.dialer{display:grid;grid-template-columns:minmax(0,1fr)260px;min-height:610px}.dial-main{padding:26px;display:grid;align-content:center}.dial-side{border-left:1px solid var(--line);background:#fafbfc;padding:16px}.dial-circle{width:140px;height:140px;border-radius:50%;background:#101828;color:#fff;display:grid;place-items:center;font-size:38px;margin:30px auto 16px}.next{padding:9px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}.next strong{display:block;font-size:11px}.next small{font-size:9px;color:var(--muted)}.inbox{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:610px}.mail{border-right:1px solid var(--line);background:#fbfcfe}.mail-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line)}.mail-row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:12px 13px;border-bottom:1px solid #edf0f4}.mail-row.active{background:#f1f0ff}.mail-row strong{font-size:12px}.mail-row small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.detail{padding:26px}.kanban-wrap{padding:14px;background:#f7f8fa;min-height:610px;overflow-x:auto}.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;min-width:900px}.col{background:#eef1f5;border-radius:13px;padding:9px;min-height:540px}.col-head{display:flex;justify-content:space-between;padding:4px 3px 9px;font-size:11px;font-weight:800}.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:7px}.kcard strong{font-size:11px}.kcard p{font-size:9px;color:var(--muted);margin:5px 0}.focus-mode{min-height:610px;display:grid;place-items:center;padding:34px;background:radial-gradient(circle at 50% 15%,#f1f0ff,#fff 38%)}.focus-only{width:min(720px,100%);text-align:center}.focus-only .rank{margin:0 auto 10px}.focus-only h2{font-size:48px;margin:0;letter-spacing:-.055em}.focus-only .reason{text-align:left}.command{display:grid;grid-template-columns:230px minmax(0,1fr)240px;gap:10px;padding:12px;background:#f8fafc;min-height:610px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.panel h3{font-size:12px;margin:0 0 9px}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.kpi{background:#f8fafc;border-radius:9px;padding:9px}.kpi span{font-size:8px;color:#98a2b3}.kpi strong{display:block;font-size:20px;margin-top:2px}.timeline{padding:24px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}.profile{border-right:1px solid var(--line);padding-right:18px}.profile h2{margin:6px 0}.event{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.event time{font-size:10px;color:#98a2b3;font-weight:800}.event strong{font-size:12px}.event p{font-size:10px;color:var(--muted);margin:3px 0}.exception{padding:18px}.exc-top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.exc{border:1px solid var(--line);border-radius:11px;padding:10px}.exc span{font-size:8px;color:#98a2b3}.exc strong{display:block;font-size:20px}.etable{width:100%;border-collapse:collapse}.etable th,.etable td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:10px}.etable th{color:#98a2b3;font-size:8px;letter-spacing:.06em}.calendar{padding:18px}.cal-grid{display:grid;grid-template-columns:90px 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.time{padding:12px;border-bottom:1px solid var(--line);color:#98a2b3;font-size:10px;background:#fafbfc}.slot{padding:9px;border-bottom:1px solid var(--line);min-height:46px}.appt{display:inline-block;background:var(--accentSoft);border:1px solid #dddafe;border-radius:9px;padding:7px 9px;font-size:10px}.pipeline{padding:14px;background:#f8fafc;min-height:610px;overflow-x:auto}.pipe{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:9px;min-width:1000px}.pipe-col{background:#eef1f5;border-radius:12px;padding:9px}.pipe-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:6px}.pipe-card strong{font-size:10px}.pipe-card small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101828;color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:820px){.top{height:58px;padding:0 12px}.brand small{display:none}.badge{font-size:8px}.shell{display:block}.nav{position:sticky;top:58px;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;background:#fff;white-space:nowrap;overflow-x:auto;z-index:15}.nav-head{display:none}.model-btn{display:inline-flex;width:auto;margin:0 4px 0 0;padding:7px 9px;vertical-align:middle}.model-btn b{font-size:10px}.idx{width:24px;height:24px}.main{padding:12px}.intro{align-items:start}.fit{display:none}.intro h1{font-size:28px}.intro p{font-size:11px}.stage{min-height:0;border-radius:15px}.eval{grid-template-columns:repeat(2,1fr)}.queue,.inbox,.timeline,.command,.dialer{display:block;min-height:0}.qleft,.mail,.profile{border-right:0;border-bottom:1px solid var(--line);max-height:230px;overflow:auto}.focus,.detail,.dial-main{padding:18px}.dial-side{display:none}.metric-row{grid-template-columns:repeat(2,1fr)}.outcomes{grid-template-columns:repeat(2,1fr)}.hero-row h2{font-size:28px}.focus-mode{min-height:520px;padding:20px}.focus-only h2{font-size:38px}.exc-top{grid-template-columns:repeat(2,1fr)}.exception{overflow:auto}.etable{min-width:650px}.calendar{padding:12px}.cal-grid{grid-template-columns:62px 1fr}.stage{overflow:auto}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">L</div><div><strong>Living CRM</strong><small>SDR Design Lab · evaluation only</small></div></div><span class="badge">PREVIEW · NO DATA WRITES</span></header>
<div class="shell"><aside class="nav"><div class="nav-head"><span>10 INTERACTION MODELS</span><strong>Choose a design</strong></div><div id="nav"></div></aside><main class="main"><section class="intro"><div><span class="eyebrow" id="num"></span><h1 id="title"></h1><p id="desc"></p></div><div class="fit"><span>FIT FOR LIVING CRM</span><strong id="fit"></strong></div></section><section id="stage" class="stage"></section><section class="eval"><div><span>FASTEST TO OPERATE</span><strong id="speed"></strong></div><div><span>LOWEST COGNITIVE LOAD</span><strong id="cognitive"></strong></div><div><span>MANAGER VISIBILITY</span><strong id="manager"></strong></div><div><span>BEST USE</span><strong id="use"></strong></div></section></main></div><div class="toast" id="toast">Preview only · no data written</div>
<script>
const Q=[
{id:'D001',rank:1,name:'Ava Carter',score:87,day:107,cad:108,units:42,provider:'Dr. Rivera',phone:'757-555-0101',reason:'Usually returns in 104–112 days; today is day 107 and her pattern is very consistent.',growth:'Maintain regular cadence'},
{id:'D002',rank:2,name:'Maya Brooks',score:82,day:96,cad:101,units:36,provider:'Dr. Rivera',phone:'757-555-0102',reason:'Approaching her normal booking window with strong prior consistency.',growth:'Strengthen cadence'},
{id:'D003',rank:3,name:'Sofia Bennett',score:78,day:121,cad:116,units:48,provider:'Dr. Chen',phone:'757-555-0103',reason:'Five days beyond her personal cadence and no future appointment is on file.',growth:'Cadence rescue'},
{id:'D004',rank:4,name:'Nora Ellis',score:74,day:103,cad:106,units:40,provider:'Dr. Chen',phone:'757-555-0104',reason:'Inside her high-response booking window.',growth:'Maintain regular cadence'},
{id:'D005',rank:5,name:'Emma Stonefield',score:69,day:134,cad:134,units:32,provider:'Dr. Rivera',phone:'757-555-0105',reason:'Exactly at her typical cadence today.',growth:'Reinforce regularity'},
{id:'D006',rank:6,name:'Lena Foster',score:65,day:94,cad:98,units:44,provider:'Dr. Chen',phone:'757-555-0106',reason:'Entering her normal decision window.',growth:'Maintain cadence'},
{id:'D007',rank:7,name:'Olivia Hart',score:62,day:151,cad:126,units:38,provider:'Dr. Rivera',phone:'757-555-0107',reason:'Past her normal cadence with no future booking.',growth:'Cadence rescue'}];
const M=[
['Next-Best-Action Queue','One client at a time. The system decides who is next and removes choice from execution.','Best fit','Excellent','Excellent','Medium','Primary SDR workspace'],
['Power-Dialer Workspace','A call-first cockpit with the active client dominant and the next few calls visible.','Excellent','Excellent','Excellent','Medium','High-volume calling'],
['Inbox / Task Queue','Dense ranked list on the left, active client on the right. Familiar and fast.','Excellent','Very good','Very good','Good','Mixed SDR work'],
['Kanban Board','Clients move across Call Now, No Answer, Follow-Up and Booked.','Good','Medium','Medium','Excellent','Status management'],
['Focus Mode','Only the single next client is visible. Maximum focus and almost no interface decisions.','Excellent','Excellent','Best','Low','Pure ranked execution'],
['Command Center','Queue, current client, KPIs and callbacks share one desktop workspace.','Very good','Good','Medium','Excellent','SDR + supervisor hybrid'],
['Conversation Timeline CRM','Client context is organized chronologically around treatments, outreach and booking behavior.','Support view','Medium','Good','Good','Complex client context'],
['Exception Queue','Humans focus only on callbacks, barriers and unusual cases.','Strong later','Excellent','Excellent','Excellent','Exception handling'],
['Calendar / Time-Block View','Callbacks and scheduled touches are arranged by time rather than score alone.','Secondary','Good','Good','Good','Scheduled callbacks'],
['Classic CRM Pipeline','Traditional stage pipeline from New through Contacted, Qualified, Booking and Won.','Weak primary fit','Low','Medium','Excellent','Traditional sales pipeline']];
let model=0,selected=0;
function hero(c){return `<div class="hero-row"><span class="rank">#${c.rank}</span><h2>${c.name}</h2><span class="score">${c.score}%</span></div><div class="sub">CALL NOW · ${c.provider} · Day ${c.day} of usual ${c.cad} days</div><div class="reason"><b>Why now</b><br>${c.reason}</div><div class="metric-row"><div class="metric"><span>DAYS SINCE TX</span><strong>${c.day}</strong></div><div class="metric"><span>TYPICAL CADENCE</span><strong>${c.cad}d</strong></div><div class="metric"><span>LAST UNITS</span><strong>${c.units}</strong></div><div class="metric"><span>GROWTH ACTION</span><strong style="font-size:11px">${c.growth}</strong></div></div>`}
function outcomes(){return `<div class="outcomes">${['No answer','Booked','Not ready','Call later','Away','Other'].map(x=>`<button class="${x==='Booked'?'book':''}" data-next>${x}</button>`).join('')}</div>`}
function renderNav(){nav.innerHTML=M.map((x,i)=>`<button class="model-btn ${i===model?'active':''}" data-model="${i}"><span class="idx">${String(i+1).padStart(2,'0')}</span><b>${x[0]}</b></button>`).join('');document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{model=+b.dataset.model;renderNav();render()})}
function qList(){return `<div class="qleft"><h3>Today · 7 remaining</h3>${Q.map((c,i)=>`<button class="qitem ${i===selected?'active':''}" data-select="${i}"><span>#${c.rank}</span><span><strong>${c.name}</strong><small>Day ${c.day} · usual ${c.cad}d</small></span><span class="score">${c.score}%</span></button>`).join('')}</div>`}
function r1(){return `<div class="queue">${qList()}<div class="focus"><div class="focus-inner">${hero(Q[selected])}<button class="call">☎ Call ${Q[selected].phone}</button>${outcomes()}</div></div></div>`}
function r2(){const c=Q[selected];return `<div class="dialer"><div class="dial-main">${hero(c)}<button class="call">Start call · ${c.phone}</button>${outcomes()}</div><aside class="dial-side"><div class="dial-circle">☎</div><div style="text-align:center;margin-bottom:18px"><b>${c.phone}</b><div class="sub">Ready to dial</div></div><h3 style="font-size:12px">Up next</h3>${Q.filter((_,i)=>i!==selected).slice(0,4).map(x=>`<div class="next"><strong>#${x.rank} ${x.name}</strong><small>${x.score}% · Day ${x.day}</small></div>`).join('')}</aside></div>`}
function r3(){return `<div class="inbox"><aside class="mail"><div class="mail-head"><b>Priority inbox</b><span class="sub">7 open</span></div>${Q.map((c,i)=>`<div class="mail-row ${i===selected?'active':''}" data-select="${i}"><span class="rank">#${c.rank}</span><span><strong>${c.name}</strong><small>${c.reason.slice(0,48)}…</small></span><span class="score">${c.score}%</span></div>`).join('')}</aside><div class="detail">${hero(Q[selected])}<button class="call">Call ${Q[selected].phone}</button>${outcomes()}</div></div>`}
function r4(){const cols=[['Call now',Q.slice(0,4)],['No answer',Q.slice(4,6)],['Follow-up',Q.slice(6)],['Booked',[]]];return `<div class="kanban-wrap"><div class="kanban">${cols.map(([n,a])=>`<section class="col"><div class="col-head"><span>${n}</span><span>${a.length}</span></div>${a.map(c=>`<div class="kcard"><strong>#${c.rank} ${c.name}</strong><span class="score" style="float:right">${c.score}%</span><p>Day ${c.day} · usual ${c.cad}d</p><button data-preview style="width:100%;border:1px solid var(--line);background:white;border-radius:8px;padding:6px;font-size:9px">Open client</button></div>`).join('')}</section>`).join('')}</div></div>`}
function r5(){const c=Q[selected];return `<div class="focus-mode"><div class="focus-only"><span class="rank">#${c.rank}</span><h2>${c.name}</h2><span class="score" style="margin:10px auto 16px">${c.score}% likely to book</span><div class="sub">Day ${c.day} · typical ${c.cad} days · ${c.provider}</div><div class="reason"><b>Why this client now</b><br>${c.reason}</div><button class="call">☎ CALL ${c.phone}</button>${outcomes()}</div></div>`}
function r6(){const c=Q[selected];return `<div class="command"><aside class="panel"><h3>Today</h3><div class="kpis"><div class="kpi"><span>LEFT</span><strong>7</strong></div><div class="kpi"><span>BOOKED</span><strong>0</strong></div><div class="kpi"><span>ANSWERED</span><strong>0</strong></div><div class="kpi"><span>DONE</span><strong>0</strong></div></div><h3>Priority queue</h3>${Q.slice(0,5).map((x,i)=>`<div class="next" data-select="${i}"><strong>#${x.rank} ${x.name} · ${x.score}%</strong><small>Day ${x.day} of ${x.cad}</small></div>`).join('')}</aside><main class="panel">${hero(c)}<button class="call">Call ${c.phone}</button>${outcomes()}</main><aside class="panel"><h3>Callbacks</h3><div class="next"><strong>2:00 PM · Maya</strong><small>Requested afternoon</small></div><div class="next"><strong>Tomorrow · Olivia</strong><small>Back from travel</small></div><h3 style="margin-top:18px">Exceptions</h3><div class="next"><strong>3 repeated no answers</strong></div></aside></div>`}
function r7(){const c=Q[selected];return `<div class="timeline"><aside class="profile"><span class="eyebrow">CLIENT</span><h2>${c.name}</h2><span class="score">${c.score}%</span><p class="sub">${c.phone}<br>${c.provider}</p><div class="metric-row" style="grid-template-columns:1fr 1fr"><div class="metric"><span>DAY</span><strong>${c.day}</strong></div><div class="metric"><span>CADENCE</span><strong>${c.cad}d</strong></div></div><button class="call">Call now</button></aside><main><h3 style="margin-top:0">Client timeline</h3>${[['TODAY','Recommended concierge call · '+c.score+'%',c.reason],['May 10','Last neurotoxin treatment',c.units+' units · '+c.provider],['Apr 28','Appointment created','Booked 12 days before treatment'],['Jan 23','Previous treatment','Returned near normal cadence']].map(e=>`<div class="event"><time>${e[0]}</time><div><strong>${e[1]}</strong><p>${e[2]}</p></div></div>`).join('')}</main></div>`}
function r8(){return `<div class="exception"><div class="exc-top"><div class="exc"><span>CALLBACKS DUE</span><strong>2</strong></div><div class="exc"><span>REPEATED NO ANSWER</span><strong>3</strong></div><div class="exc"><span>CADENCE BREAK</span><strong>4</strong></div><div class="exc"><span>OTHER BARRIERS</span><strong>1</strong></div></div><table class="etable"><thead><tr><th>CLIENT</th><th>EXCEPTION</th><th>SCORE</th><th>WHY</th><th>ACTION</th></tr></thead><tbody>${Q.slice(2,7).map((c,i)=>`<tr><td><b>${c.name}</b></td><td>${i%2?'Repeated no answer':'Past cadence'}</td><td>${c.score}%</td><td>${c.reason}</td><td><button data-preview>Open</button></td></tr>`).join('')}</tbody></table></div>`}
function r9(){const slots=['9:00','10:00','11:00','12:00','1:00','2:00','3:00','4:00'];const items={'10:00':'Maya Brooks · call back','1:00':'Emma Stonefield · requested afternoon','3:00':'Olivia Hart · travel return'};return `<div class="calendar"><div style="margin-bottom:12px"><span class="eyebrow">TUESDAY</span><h2 style="margin:3px 0">Callback schedule</h2></div><div class="cal-grid">${slots.map(s=>`<div class="time">${s}</div><div class="slot">${items[s]?`<span class="appt">${items[s]}</span>`:''}</div>`).join('')}</div></div>`}
function r10(){const cols=[['NEW PRIORITY',Q.slice(0,3)],['CONTACTED',Q.slice(3,5)],['QUALIFIED',Q.slice(5,6)],['BOOKING',Q.slice(6,7)],['WON',[]]];return `<div class="pipeline"><div class="pipe">${cols.map(([n,a])=>`<section class="pipe-col"><div class="col-head"><span>${n}</span><span>${a.length}</span></div>${a.map(c=>`<div class="pipe-card"><strong>${c.name}</strong><span class="score" style="float:right">${c.score}%</span><small>Day ${c.day} · usual ${c.cad}d</small><small>${c.provider}</small></div>`).join('')}</section>`).join('')}</div></div>`}
const R=[r1,r2,r3,r4,r5,r6,r7,r8,r9,r10];
function render(){const m=M[model];num.textContent='MODEL '+String(model+1).padStart(2,'0');title.textContent=m[0];desc.textContent=m[1];fit.textContent=m[2];speed.textContent=m[3];cognitive.textContent=m[4];manager.textContent=m[5];use.textContent=m[6];stage.innerHTML=R[model]();document.querySelectorAll('[data-select]').forEach(x=>x.onclick=()=>{selected=+x.dataset.select;render()});document.querySelectorAll('[data-next]').forEach(x=>x.onclick=()=>{selected=(selected+1)%Q.length;showToast();render()});document.querySelectorAll('[data-preview]').forEach(x=>x.onclick=showToast)}
function showToast(){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
renderNav();render();
</script>
