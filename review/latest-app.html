<!DOCTYPE html><html><head><script src="//www.google.com/jsapi"></script><script>window.parent.maeExportApis_();</script>



  

    <base target="_top">

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
  :root {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #171717;
    background: #f5f6f8;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #f5f6f8;
  }

  .shell {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .card {
    width: min(680px, 100%);
    background: #ffffff;
    border: 1px solid #e4e7ec;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #667085;
  }

  h1 {
    margin: 10px 0 12px;
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.05;
  }

  .muted {
    margin: 0;
    color: #667085;
    line-height: 1.6;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding: 14px 16px;
    border-radius: 12px;
    background: #f2f4f7;
    font-weight: 600;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: #98a2b3;
  }

  .status.ok .dot {
    background: #12b76a;
  }

  .status.error .dot {
    background: #f04438;
  }

  .meta {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 16px 0 0;
  }

  .meta > div {
    padding: 14px 16px;
    border: 1px solid #eaecf0;
    border-radius: 12px;
  }

  dt {
    color: #667085;
    font-size: 12px;
    margin-bottom: 6px;
  }

  dd {
    margin: 0;
    font-weight: 700;
  }

  @media (max-width: 560px) {
    .card {
      padding: 24px;
      border-radius: 16px;
    }

    .meta {
      grid-template-columns: 1fr;
    }
  }
</style>

  </head>

  <body>

    <main class="shell">

      <section class="card">

        <div class="eyebrow">LIVING CRM</div>

        <h1>SDR workspace scaffold</h1>

        <p class="muted">

          The GitHub → Apps Script structure is in place. No production client data is loaded yet.

        </p>



        <div class="status ok" id="status">

          <span class="dot" aria-hidden="true"></span>

          <span>Apps Script connection is working.</span>

        </div>



        <dl class="meta" id="meta">

          <div>

            <dt>Version</dt>

            <dd id="version">0.1.0</dd>

          </div>

          <div>

            <dt>Data source</dt>

            <dd id="data-source">Configured</dd>

          </div>

        </dl>

      </section>

    </main>



    <script>
  function setStatus_(message, state) {
    const status = document.getElementById('status');
    status.classList.remove('ok', 'error');
    if (state) status.classList.add(state);
    status.querySelector('span:last-child').textContent = message;
  }

  function renderStatus_(result) {
    if (!result || !result.ok) {
      setStatus_('App connection failed.', 'error');
      return;
    }

    setStatus_('Apps Script connection is working.', 'ok');

    document.getElementById('version').textContent = result.version || '—';
    document.getElementById('data-source').textContent = result.spreadsheetConfigured
      ? 'Configured'
      : 'Not configured yet';
    document.getElementById('meta').hidden = false;
  }

  function renderError_(error) {
    const message = error && error.message ? error.message : 'Unknown error';
    setStatus_(`Connection error: ${message}`, 'error');
  }

  window.addEventListener('DOMContentLoaded', function () {
    google.script.run
      .withSuccessHandler(renderStatus_)
      .withFailureHandler(renderError_)
      .getAppStatus();
  });
</script>

  



</body></html>
